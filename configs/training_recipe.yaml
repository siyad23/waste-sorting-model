# Portable hyperparameters from train22; historical paths/resume/device removed.
# Use a local yolo11n.pt to retrain; using best.pt starts further fine-tuning.
epochs: 100
patience: 50
batch: 29
imgsz: 640
workers: 8
cache: disk
pretrained: true
optimizer: AdamW
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
seed: 0
deterministic: true
amp: true
nbs: 64
cos_lr: false
rect: false
multi_scale: false
fraction: 1.0
freeze: null
box: 7.5
cls: 0.5
dfl: 1.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.5
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.1
cutmix: 0.0
copy_paste: 0.0
close_mosaic: 10
val: true
save: true
save_period: 10
plots: true
